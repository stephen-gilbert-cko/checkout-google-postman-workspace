  Checkout session creation failed:

  ``` json
  {
    "ucp": {
      "version": "2026-04-08",
      "status": "error"
    },
    "messages": [
      {
        "type": "error",
        "code": "out_of_stock",
        "content": "All requested items are currently out of stock",
        "severity": "unrecoverable"
      }
    ],
    "continue_url": "https://merchant.com/"
  }

   ```
url: "{{merchantBaseUrl}}/checkout-sessions"
method: POST
headers:
  Content-Type: application/json
  UCP-Agent: profile="https://ucp.goog/.well-known/ucp"
  Idempotency-Key: "{{$guid}}"
body:
  type: json
  content: |-
    // Create checkout with multiple items
    {
        "line_items": [
            {
                "item": {
                    // Must match ID in product feed
                    "id": "product_12345"
                },
                "quantity": 1
            },
            {
                "item": {
                    // Must match ID in product feed
                    "id": "product_67890"
                },
                "quantity": 1
            }
        ],
        "context": {
            "language": "en"
        },
        "fulfillment": {
            "methods": [
                {
                    "type": "shipping",
                    "line_item_ids": [
                        "line_1",
                        "line_2"
                    ],
                    "destinations": [
                        {
                            "id": "addr_1",
                            "address_locality": "Sunnyvale",
                            "address_region": "CA",
                            "postal_code": "94089",
                            "address_country": "US"
                        }
                    ],
                    "selected_destination_id": "addr_1"
                }
            ]
        }
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      pm.environment.set("checkoutSessionId", response["id"]);
    language: text/javascript
order: 2000
