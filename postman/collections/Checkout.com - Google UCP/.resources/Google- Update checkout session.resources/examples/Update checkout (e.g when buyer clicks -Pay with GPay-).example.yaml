auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
request:
  url: "{{merchantBaseUrl}}/checkout-sessions/{{checkoutSessionId}}"
  method: PUT
  headers:
    Content-Type: application/json
    UCP-Agent: profile="https://ucp.goog/.well-known/ucp"
    Idempotency-Key: "{{$guid}}"
  body:
    type: json
    content: |-
